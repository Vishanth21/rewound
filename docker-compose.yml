# PostgreSQL 16 + pgvector 0.8 for local development.
#   docker compose up -d
# Reads POSTGRES_USER / POSTGRES_PASSWORD from .env.local (see .env.example):
#   docker compose --env-file .env.local up -d
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lecturelens-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lecturelens
      POSTGRES_USER: ${POSTGRES_USER:-lecturelens_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.local}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d lecturelens"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: {}
